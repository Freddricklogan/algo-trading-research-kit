# Job order is lint -> test -> build -> security-scan -> deploy; deploy runs only on main.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly advisory link check

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  attribution:
    name: Attribution check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No tool attribution in the tree or the history
        run: |
          set -e
          if git grep -iIE 'claude|\banthropic|co-authored-by|generated with|noreply@anthropic' -- . ':!*.lock' ':!**/vendor/**' ':!**/node_modules/**' ':!.github/workflows/*'; then
            echo "::error::tool attribution found in tracked files"; exit 1; fi
          if git log --all --format='%an <%ae>%n%cn <%ce>%n%B' | grep -iE 'claude|\banthropic|co-authored-by|generated with|noreply@anthropic'; then
            echo "::error::tool attribution found in commit history"; exit 1; fi
          for f in CLAUDE.md AGENTS.md .cursorrules .claude .cursor .github/copilot-instructions.md; do
            [ -e "$f" ] && { echo "::error::$f must not be committed"; exit 1; }; done
          echo "attribution check: clean"

  lint:
    name: Lint (ruff + mypy --strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv venv --clear && uv pip install -e ".[dev]"
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

  # Advisory only: a new repository's own Pages URL and badge SVGs cannot exist before its first
  # green run, and external links rot. This job never blocks lint, tests, build or deploy.
  link-check:
    name: Link check (advisory)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          # 999 = LinkedIn's answer to automated requests; own actions + Pages URLs are self-referential.
          args: >-
            --no-progress --max-concurrency 4 --accept 200,206,429,999
            --exclude 'github.com/${{ github.repository }}/actions'
            --exclude 'freddricklogan.github.io/${{ github.event.repository.name }}'
            README.md docs/CASE_STUDY.md
          fail: true

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv venv --clear && uv pip install -e ".[dev]"
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    name: Build report
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv venv --clear && uv pip install -e .
      - run: uv run algo-research report --out dist --seed 42 --days 1500
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  security-scan:
    name: Security scan (bandit + pip-audit + Trivy)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv venv --clear && uv pip install -e ".[dev]"
      - run: uv run bandit -q -r src
      - run: uv run pip-audit --skip-editable
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

  deploy:
    name: Deploy report to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
